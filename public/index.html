<!doctype html>
<html lang="it" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AirlineManager</title>
<meta name="description" content="AirlineManager – gestionale gratuito e decentralizzato di compagnie aeree / free decentralized airline management sim">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230ea5e9'/%3E%3Cpath fill='white' d='M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="auth" class="auth hidden"></div>
<div id="onboard" class="auth hidden"></div>
<div id="app" class="app hidden">
  <aside class="side" id="side">
    <div class="brand"><svg viewBox="0 0 24 24" width="26" height="26"><path fill="currentColor" d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg><span>AirlineManager</span></div>
    <nav id="nav"></nav>
    <div class="side-foot"><div id="instBadge" class="muted small"></div></div>
  </aside>
  <div class="main">
    <header class="top">
      <button class="icon-btn burger" id="burger" aria-label="menu">☰</button>
      <div class="top-co"><span class="dot" id="coDot"></span><b id="coName"></b> <span class="muted small" id="coHub"></span></div>
      <div class="top-spacer"></div>
      <div class="chip" id="clock" title="Game time"></div>
      <div class="speed" id="speedBox"></div>
      <div class="chip money" id="cash"></div>
    </header>
    <main id="page" class="page"></main>
  </div>
</div>
<div id="modal" class="modal hidden"><div class="modal-card" id="modalCard"></div></div>
<div id="toasts" class="toasts"></div>

<script src="js/i18n.js"></script>
<script src="js/geo.js"></script>
<script src="js/charts.js"></script>
<script src="js/api.js"></script>
<script src="js/globe.js"></script>
<script src="js/app.js"></script>
</body>
</html>
